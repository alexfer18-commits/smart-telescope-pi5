# Mosquitto for the telescope: TLS-only, password-authenticated, per-topic ACLs.
#
# There is no plaintext listener here. 1883 is intentionally absent, so there is
# no downgrade path to an unauthenticated session.
#
# NOTE: per_listener_settings true means auth settings apply per listener, so
# each listener repeats password_file / acl_file.

per_listener_settings true

listener 8883 0.0.0.0
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
require_certificate false
allow_anonymous false
password_file /mosquitto/passwd
acl_file      /mosquitto/config/acl_file
tls_version tlsv1.2

listener 9001 0.0.0.0
protocol websockets
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
allow_anonymous false
password_file /mosquitto/passwd
acl_file      /mosquitto/config/acl_file

# A single unauthenticated listener would invalidate every other control here.

max_queued_messages 200
message_size_limit 8192
persistence false
log_dest stdout
log_type warning
log_type error
connection_messages true
