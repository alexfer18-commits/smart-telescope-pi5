# Mosquitto for the telescope: TLS-only, password-authenticated, no anonymous
# access, no persistence of command topics.

per_listener_settings true

listener 8883 0.0.0.0
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
require_certificate false
allow_anonymous false
password_file /mosquitto/passwd
tls_version tlsv1.2

listener 9001 0.0.0.0
protocol websockets
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
allow_anonymous false
password_file /mosquitto/passwd

# Plain 1883 is intentionally absent: a single unauthenticated listener
# invalidates every other control in this file.

max_queued_messages 200
message_size_limit 8192
persistence false
log_dest stdout
log_type warning
log_type error
connection_messages true
